<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email Field</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <form>
    <label for="desired-email">Desired email address</label>
    <input
      type="email"
      id="desired-email"
      name="desired_email"
      placeholder="yourname@ourdomain.tld"
      autocomplete="email"
      spellcheck="false"
      required
    >
  </form>
</body>
</html>
