<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Theme Selection</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --focus: #22c55e;
    }
    [data-theme="dark"] {
      --bg: #0b0f14;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #374151;
      --accent: #60a5fa;
      --focus: #22c55e;
    }
    [data-theme="high-contrast"] {
      --bg: #000000;
      --fg: #ffffff;
      --muted: #e5e5e5;
      --border: #ffffff;
      --accent: #ffff00;
      --focus: #00ff00;
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
    }
    main {
      max-width: 560px;
      margin: 4rem auto;
      padding: 1.25rem;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    legend {
      padding: 0 .5rem;
      font-weight: 600;
    }
    .stack {
      display: grid;
      gap: .5rem;
      margin-top: .5rem;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      cursor: pointer;
    }
    input[type="radio"] {
      inline-size: 1rem;
      block-size: 1rem;
      accent-color: var(--accent);
    }
