<form action="#" method="post">
  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    name="email"
    autocomplete="email"
    required
    aria-describedby="email-note"
  />
  <p id="email-note">We will never share or sell your email address.</p>
  <button type="submit">Submit</button>
</form>
