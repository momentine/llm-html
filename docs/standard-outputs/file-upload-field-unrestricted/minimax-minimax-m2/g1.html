<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unrestricted File Upload</title>
</head>
<body>
  <form action="#" method="post" enctype="multipart/form-data">
    <label for="file">Upload a File</label>
    <input type="file" id="file" name="file" accept="*/*">
    <button type="submit">Upload</button>
  </form>
</body>
</html>
