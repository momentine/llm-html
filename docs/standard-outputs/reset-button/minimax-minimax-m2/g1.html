<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form with Reset Button</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <form>
    <label>
      Name:
      <input name="name" value="Jane Doe">
    </label>
    <br>
    <label>
      Email:
      <input name="email" type="email" value="jane@example.com">
    </label>
    <br>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
