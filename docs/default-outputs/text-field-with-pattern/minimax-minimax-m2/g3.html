<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two Letters + Three Numbers Input</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <label for="code">Enter two letters followed by 3 numbers</label>
  <input
    id="code"
    name="code"
    type="text"
    placeholder="AB123"
    pattern="[A-Za-z]{2}[0-9]{3
