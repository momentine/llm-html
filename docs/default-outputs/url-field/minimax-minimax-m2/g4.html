<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website URL Field</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.5; padding: 2rem; }
    .field { max-width: 42rem; }
    label { display: block; font-weight: 600; margin-bottom: .375rem; }
    input[type="url"] {
      width: 100%; padding: .625rem .75rem; font-size: 1rem;
      border: 1px solid #c7c7c7; border-radius: .375rem; outline: none;
    }
    input[type="url"]:focus { border-color: #4c8bf5; box-shadow: 0 0 0 3px rgba(76,139,245,.2); }
    .hint { color: #555; font-size: .9rem; margin-top: .375rem; }
  </style>
</head>
<body>
  <form action="#" method="post" novalidate>
    <div class="field">
      <label for="website-url">Website URL</label>
      <input
        id="website-url"
        name="website_url"
        type="url"
        inputmode="url"
        placeholder="https://example.com"
        autocomplete="url"
        spellcheck="false"
        required
        aria-describedby="website-url-hint"
      />
      <div id="website-url-hint" class="hint">Enter the full URL starting with https://</div>
    </div>
  </form>
</body>
</html>
