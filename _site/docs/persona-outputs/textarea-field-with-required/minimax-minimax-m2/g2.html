<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Form</title>
</head>
<body>
  <form action="#" method="post">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required aria-required="true" placeholder="Type your message..."></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
