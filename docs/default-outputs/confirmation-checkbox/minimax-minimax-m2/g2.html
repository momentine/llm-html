<form>
  <div>
    <input id="agree" type="checkbox">
    <label for="agree">I agree to the <a href="/terms" target="_blank" rel="noopener noreferrer">Terms and Conditions</a></label>
  </div>
  <button type="submit" id="submitBtn" disabled>Continue</button>
  <script>
    (function(){
      const cb = document.getElementById('agree');
      const btn = document.getElementById('submitBtn');
      function sync() {
        btn.disabled = !cb.checked;
      }
      cb.addEventListener('change', sync);
      sync();
    })();
  </script>
</form>
