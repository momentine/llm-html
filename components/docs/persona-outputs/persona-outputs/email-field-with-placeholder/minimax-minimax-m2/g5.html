<label for="desired-email">Desired email address</label>
<input
  id="desired-email"
  name="desired-email"
  type="email"
  inputmode="email"
  autocomplete="email"
  placeholder="yourname@ourdomain.tld"
  aria-describedby="desired-email-hint"
  required
/>
<p id="desired-email-hint" style="margin:0.25rem 0 0; color:#555;">Use yourname@ourdomain.tld</p>
