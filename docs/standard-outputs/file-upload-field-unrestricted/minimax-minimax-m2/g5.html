<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Unrestricted File Upload</title>
  <style>
    :root {
      --focus: #0a7cff;
      --border: #c7c7c7;
      --text: #111;
      --muted: #555;
      --bg: #fff;
      --hover: #f6f6f6;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      margin: 0;
      padding: 2rem;
    }

    .field {
      max-width: 32rem;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .625rem 1rem;
      border: 1px solid var(--border);
      border-radius: .5rem;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      text-decoration: none;
    }

    .label:hover {
      background: var(--hover);
    }

    .label:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .hint {
      display: block;
      margin-top: .5rem;
      color: var(--muted);
      font-size: .9375rem;
    }
