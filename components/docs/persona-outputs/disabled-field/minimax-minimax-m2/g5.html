<label for="promoCode">Promo code</label>
<input
  id="promoCode"
  name="promoCode"
  type="text"
  value="SUMMER10"
  disabled
  aria-disabled="true"
  aria-describedby="promoHint promoAppliedNote"
  style="padding:8px 10px;border:1px solid #9aa0a6;border-radius:4px;background:#f3f4f6;color:#374151;width:240px"
/>
<div id="promoAppliedNote" role="status" aria-live="polite" style="margin-top:4px;color:#065f46;font-size:0.95rem">Promo code applied.</div>
<div id="promoHint" style="margin-top:2px;color:#6b7280;font-size:0.875rem">Promo codes can be entered at checkout.</div>
