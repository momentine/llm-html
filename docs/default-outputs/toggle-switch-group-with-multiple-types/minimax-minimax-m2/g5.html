<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Notification Type Toggles</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --focus: #2563eb;
      --track-off: #e5e7eb;
      --track-on: #10b981;
      --thumb: #ffffff;
      --shadow: rgba(0, 0, 0, 0.18);
      --radius: 9999px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      padding: 2rem;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      max-width: 28rem;
    }

    legend {
      font-weight: 600;
      padding: 0 0.25rem;
    }

    .help {
      color: var(--muted);
      font-size: 0.9375rem;
      margin: 0.25rem 0 0.75rem;
    }

      align-items: center;
