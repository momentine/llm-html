<fieldset>
  <legend>What fruits do you like?</legend>
  <div>
    <input type="checkbox" id="fruit_bananas" name="fruits" value="bananas">
    <label for="fruit_bananas">bananas</label>
  </div>
  <div>
    <input type="checkbox" id="fruit_oranges" name="fruits" value="oranges">
    <label for="fruit_oranges">oranges</label>
  </div>
  <div>
    <input type="checkbox" id="fruit_apples" name="fruits" value="apples">
    <label for="fruit_apples">apples</label>
  </div>
  <p>You can change this later</p>
</fieldset>
