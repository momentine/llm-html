```html
<div>
  <label for="message">Message</label>
  <textarea 
    id="message" 
    name="message" 
    maxlength="200" 
    aria-describedby="message-count"
    rows="4"
    cols="50"
  ></textarea>
  <div id="message-count" aria-live="polite">
    <span id="current-count">0</span>/200 characters
  </div>
</div>
