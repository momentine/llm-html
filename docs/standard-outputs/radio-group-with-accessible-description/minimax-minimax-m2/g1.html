<form>
  <fieldset>
    <legend>Theme</legend>
    <div role="radiogroup" aria-labelledby="theme-label">
      <span id="theme-label" class="sr-only">Theme</span>
      <label>
        <input type="radio" name="theme" value="light" checked>
        Light
      </label>
      <label>
        <input type="radio" name="theme" value="dark">
        Dark
      </label>
      <label>
        <input type="radio" name="theme" value="high-contrast">
        High contrast
      </label>
    </div>
    <small>You can change this later.</small>
  </fieldset>
</form>
