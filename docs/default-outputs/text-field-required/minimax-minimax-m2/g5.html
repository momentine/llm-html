<form action="#" method="get">
  <label for="orange-color">What color is an orange?</label>
  <input
    id="orange-color"
    name="orange-color"
    type="text"
    required
    aria-required="true"
    aria-describedby="orange-hint orange-error"
    autocomplete="off"
  />
  <div id="orange-hint">Enter the color (for example: orange).</div>
  <div id="orange-error" role="alert" aria-live="polite"></div>
  <button type="submit">Submit</button>
</form>
