<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Theme Selector</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --surface: #f3f4f6;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --focus: #f59e0b;
    }

    html[data-theme="dark"] {
      --bg: #0b0f14;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --surface: #111827;
      --border: #374151;
      --accent: #60a5fa;
      --accent-contrast: #0b0f14;
      --focus: #f59e0b;
    }

    html[data-theme="hc"] {
      --bg: #000000;
      --text: #ffffff;
      --muted: #ffffff;
      --surface: #000000;
      --border: #ffffff;
      --accent: #ffff00;
      --accent-contrast: #000000;
      --focus: #00ff00;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
