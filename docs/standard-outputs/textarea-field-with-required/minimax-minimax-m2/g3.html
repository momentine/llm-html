<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Required Message Textarea</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <form action="#" method="post">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required aria-required="true" placeholder="Enter your message..."></textarea>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
