<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Disabled Promo Code Field</title>
</head>
<body>
  <label for="promo-code">Promo Code</label>
  <input
    id="promo-code"
    name="promoCode"
    type="text"
    value="SUMMER25"
    disabled
    readonly
    aria-disabled="true"
    tabindex="-1"
    style="padding:8px 10px;border:1px solid #c7c7c7;border-radius:4px;background:#f5f5f5;color:#555;width:240px"
  />
</body>
</html>
