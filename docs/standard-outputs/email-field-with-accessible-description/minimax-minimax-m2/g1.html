<form action="#" method="post">
  <label for="email">Email Address</label>
  <input
    id="email"
    name="email"
    type="email"
    placeholder="you@example.com"
    autocomplete="email"
    inputmode="email"
    required
    aria-describedby="email-note"
  />
  <small id="email-note">We will never share or sell your email address.</small>
</form>
