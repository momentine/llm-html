<div>
  <label for="photo-upload">
    Upload Photo
    <span aria-label="required">*</span>
  </label>
  <input 
    type="file" 
    id="photo-upload" 
    name="photo-upload" 
    accept="image/*"
    aria-required="true"
    aria-describedby="photo-upload-help"
  >
  <div id="photo-upload-help">
    Accepted formats: JPG, PNG, GIF. Maximum file size: 5MB.
  </div>
</div>
