```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Address Field</title>
</head>
<body>
    <div>
        <label for="email">Email Address</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            aria-describedby="email-note"
            required
        >
        <p id="email-note">We will never share or sell your email address</p>
    </div>
</body>
</html>
