<form action="#" method="post" novalidate>
  <div>
    <label for="desired-email">Desired email address</label>
    <input
      id="desired-email"
      name="email"
      type="email"
      inputmode="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      required
      maxlength="254"
      aria-describedby="desired-email-help desired-email-error"
      aria-invalid="false"
    />
    <div id="desired-email-help">
      Use a valid email you can access. We’ll send a verification link.
    </div>
    <div id="desired-email-error" role="alert" aria-live="polite" hidden>
      Enter a valid email address (e.g., name@example.com).
    </div>
  </div>
  <button type="submit">Continue</button>
</form>
