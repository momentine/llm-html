<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Birthdate Field</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .35rem; font-weight: 600; }
    input[type="date"] { padding: .5rem .6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: .4rem; min-width: 14rem; }
    button { padding: .6rem 1rem; font-size: 1rem; }
    .error { color: #b00020; margin-top: .35rem; }
    @media (prefers-color-scheme: dark) {
      input[type="date"] { background: #121212; color: #eaeaea; border-color: #444; }
    }
  </style>
</head>
<body>
  <form id="demoForm" action="#" method="post" novalidate>
    <div class="field">
      <label for="birthdate">Birthdate</label>
      <input
        type="date"
        id="birthdate"
        name="birthdate"
        required
        aria-describedby="birthdateHelp birthdateError"
      />
      <div id="birthdateHelp" style="margin-top:.35rem;">Enter your date of birth. You must be at least 18 years old.</div>
      <div id="birthdateError" class="error" role="
