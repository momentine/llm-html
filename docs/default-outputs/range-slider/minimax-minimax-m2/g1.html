<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Volume Range Slider</title>
</head>
<body>
  <label for="volume">Volume</label>
  <input type="range" id="volume" name="volume" min="1" max="10" step="1" value="5" aria-label="Volume">
  <output for="volume" id="volume-value">5</output>
</body>
</html>
