<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Birthdate Field</title>
</head>
<body>
  <form>
    <label for="birthdate">Birthdate</label>
    <input
      type="date"
      id="birthdate"
      name="birthdate"
      required
      autocomplete="bday"
      min="1900-01-01"
      max="9999-12-31"
    />
  </form>
</body>
</html>
