<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website URL Field</title>
</head>
<body>
  <form action="#" method="post">
    <label for="website-url">Website URL</label>
    <input
      type="url"
      id="website-url"
      name="website_url"
      placeholder="https://example.com"
      autocomplete="url"
      inputmode="url"
      spellcheck="false"
      required
      pattern="https?://.+"
      title="Please enter a full URL that starts with http:// or https://"
      aria-describedby="website-url-help"
    />
    <small id="website-url-help">Enter the full URL including http:// or https://</small>
  </form>
</body>
</html>
