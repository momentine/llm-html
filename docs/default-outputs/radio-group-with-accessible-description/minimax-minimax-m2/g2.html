<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Theme Selection</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.5; margin: 2rem; }
    fieldset { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; max-width: 420px; }
    legend { font-weight: 600; padding: 0 .5rem; }
    .options { display: grid; gap: .5rem; margin-top: .5rem; }
    label { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; }
    input[type="radio"] { transform: translateY(1px); }
    .note { color: #57606a; font-size: .9rem; margin-top: .5rem; }
    .actions { margin-top: 1rem; }
    button { padding: .5rem .9rem; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; cursor: pointer; }
    button:hover { background: #eef2f6; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <fieldset aria-describedby="theme-note">
      <legend>Theme</legend>
      <div class="options">
        <label>
          <input type="radio" name="theme" value="light" checked />
          Light
        </label>
        <label>
          <input type="radio" name="theme" value="dark" />
          Dark
        </label>
        <label>
          <input type="radio" name="theme" value="high-contrast" />
          High contrast
        </label>
      </div>
      <p id="theme-note" class="note">You can change this later.</p>
      <div class="actions">
        <button type="submit">Continue</button>
      </div>
    </fieldset>
  </form>
</body>
</html
