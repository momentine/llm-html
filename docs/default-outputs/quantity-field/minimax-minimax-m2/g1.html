<form action="#" method="post">
  <label for="item-quantity">Item Quantity</label>
  <input
    type="number"
    id="item-quantity"
    name="item_quantity"
    min="1"
    step="1"
    required
    inputmode="numeric"
    pattern="[0-9]*"
    placeholder="Enter quantity"
  />
  <button type="submit">Add Item</button>
</form>
