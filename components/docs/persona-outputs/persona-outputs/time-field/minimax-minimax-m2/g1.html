<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Time Field</title>
</head>
<body>
  <form>
    <label for="meeting-time">Meeting Time</label>
    <input
      type="time"
      id="meeting-time"
      name="meeting_time"
      required
      min="08:00"
      max="18:00"
      step="900"
      autocomplete="off"
    >
  </form>
</body>
</html>
