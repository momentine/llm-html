<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Item Quantity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <form action="#" method="post">
    <label for="item-quantity">Item Quantity</label>
    <input
      type="number"
      id="item-quantity"
      name="item_quantity"
      min="1"
      step="1"
      required
      inputmode="numeric"
      placeholder="e.g., 2"
    >
    <button type="submit">Add to Cart</button>
  </form>
</body>
</html>
