<form action="#" method="get">
  <label for="website-url">Website URL</label>
  <input
    id="website-url"
    name="website_url"
    type="url"
    required
    placeholder="https://example.com"
    inputmode="url"
    spellcheck="false"
    autocomplete="url"
    pattern="https?://.+"
    title="Enter a valid URL starting with http:// or https://"
  />
  <button type="submit">Submit</button>
</form>
