<form id="newPasswordForm" novalidate>
  <div>
    <label for="newPassword">New password</label>
    <p id="passwordHint">Must include 1 number and 1 symbol.</p>
    <div style="position:relative;display:flex;align-items:center;gap:.5rem">
      <input
        id="newPassword"
        name="newPassword"
        type="password"
        inputmode="text"
        autocomplete="new-password"
        aria-describedby="passwordHint passwordError"
        aria-invalid="false"
        required
      />
      <button type="button" id="togglePassword" aria-pressed="false" aria-controls="newPassword" style="white-space:nowrap">
        Show
      </button>
    </div>
    <p id="passwordError" role="alert" aria-live="polite" style="color:#b00020;margin:.25rem 0 0;min-height:1.25rem"></p>
    <button type="submit" id="submitBtn" disabled>Set password</button>
  </div>
</form>
