<form action="#" method="post">
  <div>
    <label for="message">Message <span aria-hidden="true">*</span></label>
    <p id="message-desc">Please enter your message.</p>
    <textarea
      id="message"
      name="message"
      rows="6"
      required
      aria-describedby="message-desc"
      aria-required="true"
    ></textarea>
  </div>
  <button type="submit">Send</button>
</form>
