<form>
  <fieldset>
    <legend>Theme</legend>
    <div role="radiogroup" aria-describedby="theme-note">
      <label>
        <input type="radio" name="theme" value="light" checked>
        Light
      </label>
      <label>
        <input type="radio" name="theme" value="dark">
        Dark
      </label>
      <label>
        <input type="radio" name="theme" value="high-contrast">
        High contrast
      </label>
    </div>
    <p id="theme-note">You can change this later.</p>
  </fieldset>
</form>
