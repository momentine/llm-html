<form action="#" method="post" novalidate>
  <div class="field">
    <label for="promo">Promo code</label>
    <input
      id="promo"
      name="promo"
      type="text"
      value="SAVE20"
      disabled
      aria-disabled="true"
      aria-describedby="promo-help promo-status"
      autocomplete="off"
      inputmode="text"
    />
    <p id="promo-help" class="help">
      A promo code has been applied to your order.
    </p>
    <p id="promo-status" class="sr-only" aria-live="polite">
      Promo code applied.
    </p>
  </div>
</form>
