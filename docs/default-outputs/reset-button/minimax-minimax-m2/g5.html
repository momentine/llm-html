<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessible Reset Button</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.5; margin: 2rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    button { font: inherit; }
    .btn { padding: .5rem .9rem; border: 1px solid #444; background: #f6f6f6; border-radius: .375rem; cursor: pointer; }
    .btn:focus-visible { outline: 3px solid #0a84ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Accessible Reset Button</h1>

  <form id="demoForm" action="#" method="post" novalidate>
    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" value="Ada Lovelace" />
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="ada@example.com" />
    </div>

    <div>
      <label for="role">Role</label>
      <select id="role" name="role">
        <option>Engineer</option>
        <option selected>Researcher</option>
        <option>Designer</option>
      </select>
    </div>
