<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Read-only User ID Field</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <form action="/submit" method="post">
    <label for="userId">User ID</label>
    <input
      type="text"
      id="userId"
      name="userId"
      value="12345"
      readonly
      aria-readonly="true"
    >
  </form>
</body>
</html>
