<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notification Types Toggle Switches</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --track-off: #e5e7eb;
      --track-on: #10b981;
      --knob: #ffffff;
      --focus: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem 1.25rem;
      max-width: 420px;
    }
    legend {
      font-weight: 600;
      padding: 0 .25rem;
    }
    .hint {
      color: var(--muted);
      font-size: .9rem;
      margin: .25rem 0 1rem;
    }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .5rem 0;
    }
    .switch .label-text {
      flex: 1;
      font-weight: 500;
    }
