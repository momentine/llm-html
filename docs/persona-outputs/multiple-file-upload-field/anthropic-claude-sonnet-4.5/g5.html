```html
<div>
  <label for="file-upload">
    Upload Files
    <span aria-label="Accepted file types: PDF, DOCX, TXT, PNG, JPG, GIF, SVG">(Accepted: .pdf, .docx, .txt, .png, .jpg, .gif, .svg)</span>
  </label>
  <input 
    type="file" 
    id="file-upload" 
    name="file-upload" 
    multiple 
    accept=".pdf,.docx,.txt,.png,.jpg,.jpeg,.gif,.svg"
    aria-describedby="file-upload-description"
  />
  <div id="file-upload-description">
    You can select multiple files. Accepted formats: PDF, DOCX, TXT, PNG, JPG, GIF, SVG
  </div>
</div>
```
