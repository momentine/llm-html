<form action="/subscribe" method="post" novalidate>
  <label for="email">Email Address</label>
  <input
    id="email"
    name="email"
    type="email"
    required
    autocomplete="email"
    inputmode="email"
    aria-describedby="email-note"
  />
  <p id="email-note">We will never share or sell your email address.</p>
  <button type="submit">Submit</button>
</form>
