<!DOCTYPE html>
<html lang="en">
<head>
    <title>Accessible Textarea</title>
</head>
<body>
    <label for="message-input">Message</label>
    <textarea id="message-input" name="message" aria-describedby="message-description"></textarea>
    <p id="message-description">Please describe your problem in as much detail as possible.</p>
</body>
