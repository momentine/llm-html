<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessible Phone Number Field</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0;
      padding: 2rem;
      line-height: 1.5;
    }
    form {
      max-width: 32rem;
    }
    label {
      font-weight: 600;
      display: inline-block;
      margin-bottom: .25rem;
    }
    .hint {
      color: #555;
      font-size: .9375rem;
      margin: 0 0 .5rem 0;
    }
    input[type="tel"] {
      width: 100%;
      padding: .625rem .75rem;
      font-size: 1rem;
      border: 1px solid #888;
      border-radius: .375rem;
    }
    input[type="tel"]:focus {
      outline: 2px solid transparent;
      box-shadow: 0 0 0 3px rgba(0, 114, 245, .35);
      border-color: #0072f5;
    }
    .error {
      color: #b00020;
      margin-top: .375rem;
      font-size: .9375rem;
    }
    [aria-invalid="true"] {
      border-color: #b00020;
      box-shadow: 0 0 0 3px rgba(176, 0, 32, .15);
    }
    .actions {
      margin-top: 1rem;
    }
    button {
      padding: .625rem 1rem;
      font-size: 1rem;
      border: 1px solid #0a66c2;
      background: #0a66c2;
      color: #fff;
      border-radius: .375rem;
      cursor: pointer;
    }
    button:hover {
      filter: brightness(0.95);
    }
  </style>
</head>
<body>
