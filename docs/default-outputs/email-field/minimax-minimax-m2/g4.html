```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Desired email address</title>
</head>
<body>
  <form action="#" method="post">
    <label for="desired-email">Desired email address</label>
    <input
      id="desired-email"
      name="desired_email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      inputmode="email"
      spellcheck="false"
      required
    />
  </form>
</body>
</html>
