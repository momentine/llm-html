<form>
  <div>
    <label for="file-upload">Upload a File</label>
    <input 
      type="file" 
      id="file-upload" 
      name="file-upload"
      aria-describedby="file-upload-description"
    />
    <div id="file-upload-description">
      Select any file from your device to upload.
    </div>
  </div>
</form>
