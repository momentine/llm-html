```html
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Accessible Time Field</title>
</head>
<body>
    <form>
        <div>
            <label for="meeting-time">Meeting Time</label>
            <input type="time" id="meeting-time" name="meeting-time" required aria-describedby="meeting-time-hint">
            <p id="meeting-time-hint">Please enter the time in HH:MM format, for example, 14:30 for 2:30 PM.</p>
        </div>
    </form>
</body>
</html>
```
