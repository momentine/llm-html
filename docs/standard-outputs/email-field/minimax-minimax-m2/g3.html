<form action="/submit" method="post">
  <label for="desired-email">Desired email address</label>
  <input
    id="desired-email"
    name="desired_email"
    type="email"
    placeholder="you@example.com"
    required
    autocomplete="email"
    spellcheck="false"
    inputmode="email"
  />
  <button type="submit">Continue</button>
</form>
