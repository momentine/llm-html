<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Search Field</title>
</head>
<body>
  <form action="/search" method="get">
    <label for="search">Search</label>
    <input
      id="search"
      name="q"
      type="search"
      placeholder="Search..."
      aria-label="Search"
      required
    />
  </form>
</body>
</html>
