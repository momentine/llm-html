<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Number Field</title>
</head>
<body>
  <div>
    <label for="item-quantity">Item Quantity</label>
    <input type="number" id="item-quantity" name="quantity" value="1" min="1" aria-label="Item Quantity">
  </div>
</body>
</html>
