<fieldset aria-labelledby="theme-legend">
  <legend id="theme-legend">Theme</legend>
  <div>
    <input type="radio" id="theme-light" name="theme" value="light" aria-checked="false">
    <label for="theme-light">Light</label>
  </div>
  <div>
    <input type="radio" id="theme-dark" name="theme" value="dark" aria-checked="false">
    <label for="theme-dark">Dark</label>
  </div>
  <div>
    <input type="radio" id="theme-high-contrast" name="theme" value="high-contrast" aria-checked="false">
    <label for="theme-high-contrast">High Contrast</label>
  </div>
</fieldset>
