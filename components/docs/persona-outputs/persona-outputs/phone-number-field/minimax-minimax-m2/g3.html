<label for="phone">Phone number</label>
<input
  type="tel"
  id="phone"
  name="phone"
  placeholder="+1 (555) 123-4567"
  autocomplete="tel"
  inputmode="tel"
  pattern="^\+?[0-9\s\-()]{7,20}$"
  aria-describedby="phone-hint"
/>
<small id="phone-hint">Use numbers, spaces, dashes, parentheses, and an optional leading +.</small>
