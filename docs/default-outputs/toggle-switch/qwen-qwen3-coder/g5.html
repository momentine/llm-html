```html
<div class="toggle-container">
  <label for="notification-toggle" class="toggle-label">
    Notifications
  </label>
  <button
    type="button"
    id="notification-toggle"
    role="switch"
    aria-checked="false"
    class="toggle-switch"
  >
    <span class="toggle-track">
      <span class="toggle-thumb"></span>
    </span>
  </button>
</div>
