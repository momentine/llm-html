<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} · {{ site.title }}</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#fff;color:#111;}
    header{border-bottom:1px solid #eee;padding:14px 18px;position:sticky;top:0;background:#fff;z-index:5;}
    header a{color:#111;text-decoration:none;font-weight:700;}
    .wrap{max-width:1200px;margin:0 auto;padding:18px;}
    .tabs a{display:inline-block;margin-right:12px;padding:6px 10px;border-radius:10px;text-decoration:none;color:#111;border:1px solid #eee;}
    .tabs a.active{border-color:#111;}
    .grid{display:grid;grid-template-columns:320px 1fr;gap:20px;}
    .panel{border:1px solid #eee;border-radius:14px;padding:14px;}
    .sidebar a{display:block;padding:8px 10px;border-radius:10px;text-decoration:none;color:#111;}
    .sidebar a:hover{background:#f7f7f7;}
    .muted{color:#666;font-size:14px;}
    details{border:1px solid #eee;border-radius:12px;padding:10px 12px;margin:12px 0;}
    details > summary{cursor:pointer;font-weight:700;}
    table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;}
    th,td{border:1px solid #e6e6e6;padding:8px;vertical-align:top;}
    th{background:#fafafa;text-align:left;}
    pre{overflow:auto;background:#0b0b0b;color:#f4f4f4;padding:12px;border-radius:12px;}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="tabs" style="margin-top:10px;">
        <a href="{{ '/minimal' | relative_url }}" class="{% if page.track == 'minimal' %}active{% endif %}">Minimal</a>
        <a href="{{ '/best-case' | relative_url }}" class="{% if page.track == 'best-case' %}active{% endif %}">Best Practice</a>
        <a href="{{ '/persona' | relative_url }}" class="{% if page.track == 'persona' %}active{% endif %}">With Persona</a>
      </div>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
</body>
</html>
