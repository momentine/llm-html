<div>
  <label for="desired-email">Desired email address</label>
  <div id="desired-email-hint">Use a valid email address (e.g., name@example.com).</div>
  <input
    id="desired-email"
    name="desiredEmail"
    type="email"
    inputmode="email"
    autocomplete="email"
    required
    aria-required="true"
    aria-describedby="desired-email-hint"
  />
</div>
