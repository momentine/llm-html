<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notification Types Toggles</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.4; padding: 24px; }
    fieldset { border: 1px solid #d0d7de; border-radius: 10px; padding: 16px 16px 12px; max-width: 420px; }
    legend { font-weight: 600; padding: 0 6px; }

    .toggles { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }

    /* Visually hidden but accessible checkbox */
    .toggle-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Switch */
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .slider {
      position: relative;
      width: 44px;
      height: 24px;
      background: #c7cdd4;
      border-radius: 999px;
      transition: background-color .2s ease;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }
    .slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }

    /* Checked state */
    .toggle-input:checked +
