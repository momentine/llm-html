<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Theme Radio Group</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <form action="#" method="post">
    <fieldset>
      <legend>Theme</legend>
      <div>
        <input type="radio" id="theme-light" name="theme" value="light" aria-describedby="theme-note">
        <label for="theme-light">light</label>
      </div>
      <div>
        <input type="radio" id="theme-dark" name="theme" value="dark" aria-describedby="theme-note">
        <label for="theme-dark">dark</label>
      </div>
      <div>
        <input type="radio" id="theme-hc" name="theme" value="high-contrast" aria-describedby="theme-note">
        <label for="theme-hc">high contrast</label>
      </div>
      <p id="theme-note">You can change this later.</p>
    </fieldset>
  </form>
</body>
</html>
