<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Read-only User ID Field</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    .field { max-width: 420px; }
    label { display: block; font-weight: 600; margin-bottom: .375rem; }
    input[readonly] {
      width: 100%;
      padding: .5rem .625rem;
      border: 1px solid #c7c7c7;
      border-radius: .375rem;
      background: #f5f5f5;
      color: #333;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="field">
    <label for="user-id">User ID</label>
    <input
      id="user-id"
      name="userId"
      type="text"
      value="user-12345"
      readonly
      aria-readonly="true"
      autocomplete="off"
    />
  </div>
</body>
</html>
