<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload Files</title>
</head>
<body>
  <form action="#" method="post" enctype="multipart/form-data">
    <label for="files">Upload Files</label>
    <input
      type="file"
      id="files"
      name="files[]"
      multiple
      accept=".pdf,.docx,.txt,.png,.jpg,.gif,.svg"
    >
    <button type="submit">Submit</button>
  </form>
</body>
</html>
