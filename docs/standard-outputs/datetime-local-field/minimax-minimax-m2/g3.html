<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Time Input</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input[type="datetime-local"] { padding: 0.5rem; font-size: 1rem; }
    form { max-width: 420px; }
  </style>
</head>
<body>
  <form>
    <label for="event-time">Event Time</label>
    <input
      id="event-time"
      name="eventTime"
      type="datetime-local"
      required
    />
    <div style="height: 0.75rem"></div>
    <button type="submit">Submit</button>
  </form>

  <script>
    // Set minimum selectable time to now (local time)
    (function () {
      const input = document.getElementById('event-time');
      if (!input) return;
      const toLocalDatetime = (d) => {
        const pad = (n) => String(n).padStart(2, '0');
        return d.getFullYear() + '-' +
               pad(d.getMonth() + 1) + '-' +
               pad(d.getDate()) + 'T' +
               pad(d.getHours()) + ':' +
               pad(d.getMinutes());
      };
      input.min = toLocalDatetime(new Date());
    })();
  </script>
</body>
</html>
