<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theme Select</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --accent: #0a84ff;
      --border: #e5e7eb;
      --card: #f8fafc;
    }
    [data-theme="dark"] {
      --bg: #0b0f14;
      --fg: #e6e6e6;
      --accent: #4da3ff;
      --border: #1f2937;
      --card: #0f172a;
    }
    [data-theme="high-contrast"] {
      --bg: #000000;
      --fg: #ffffff;
      --accent: #ffff00;
      --border: #ffffff;
      --card: #000000;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      width: min(520px, 90vw);
    }
    label { font-weight: 600; }
    select {
      margin-top: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .row { display: grid; gap: 0.5
