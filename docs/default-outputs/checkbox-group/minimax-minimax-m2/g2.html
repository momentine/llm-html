<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkbox group: What fruits do you like?</title>
</head>
<body>
  <form>
    <fieldset>
      <legend>What fruits do you like?</legend>
      <label>
        <input type="checkbox" name="fruits[]" value="bananas" />
        bananas
      </label>
      <label>
        <input type="checkbox" name="fruits[]" value="oranges" />
        oranges
      </label>
      <label>
        <input type="checkbox" name="fruits[]" value="apples" />
        apples
      </label>
    </fieldset>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
