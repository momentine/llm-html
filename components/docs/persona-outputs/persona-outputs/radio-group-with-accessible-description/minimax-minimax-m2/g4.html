<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theme Radio Group</title>
</head>
<body>
  <form>
    <fieldset role="group" aria-labelledby="theme-label" aria-describedby="theme-note">
      <legend id="theme-label">Theme</legend>

      <label>
        <input type="radio" name="theme" id="theme-light" value="light" checked />
        Light
      </label>

      <label>
        <input type="radio" name="theme" id="theme-dark" value="dark" />
        Dark
      </label>

      <label>
        <input type="radio" name="theme" id="theme-hc" value="high-contrast" />
        High contrast
      </label>

      <div id="theme-note">You can change this later</div>
    </fieldset>
  </form>
</body>
</html>
