```html
<div class="form-group">
  <label for="credit-card-number">Credit Card Number</label>
  <input 
    type="text" 
    id="credit-card-number" 
    name="credit-card-number" 
    inputmode="numeric" 
    pattern="[0-9\s]{13,22}" 
    maxlength="22" 
    placeholder="1234 5678 9012 3456" 
    autocomplete="cc-number" 
    required
    aria-describedby="credit-card-help"
  >
  <div id="credit-card-help" class="sr-only">Enter your credit card number as it appears on your card</div>
</div>
```
