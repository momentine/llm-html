<fieldset>
<legend>Theme</legend>
<input id="theme-light" type="radio" name="theme" value="light">
<label for="theme-light">Light</label>
<input id="theme-dark" type="radio" name="theme" value="dark">
<label for="theme-dark">Dark</label>
<input id="theme-high-contrast" type="radio" name="theme" value="high-contrast">
<label for="theme-high-contrast">High contrast</label>
<small>You can change this later</small>
</fieldset>
