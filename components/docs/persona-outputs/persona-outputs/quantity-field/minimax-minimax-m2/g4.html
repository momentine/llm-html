<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Item Quantity</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    .field { max-width: 320px; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input[type="number"] { width: 100%; padding: 0.5rem; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="field">
    <label for="item-quantity">Item Quantity</label>
    <input
      type="number"
      id="item-quantity"
      name="itemQuantity"
      min="1"
      step="1"
      required
      inputmode="numeric"
      aria-describedby="quantity-help"
    />
    <small id="quantity-help" style="color:#666">Enter a whole number (minimum 1).</small>
  </div>
</body>
</html>
