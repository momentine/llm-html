<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Birthdate Field</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <form action="#" method="post">
    <label for="birthdate">Birthdate</label>
    <input
      type="date"
      id="birthdate"
      name="birthdate"
      required
      autocomplete="bday"
      aria-describedby="birthdate-help"
    >
    <small id="birthdate-help">Enter your date of birth.</small>
  </form>
</body>
</html>
