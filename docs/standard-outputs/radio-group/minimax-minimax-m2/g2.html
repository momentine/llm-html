<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Theme Selector: Light, Dark, High Contrast</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --surface: #f9fafb;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --focus: #0ea5e9;
    }
    html[data-theme="dark"] {
      --bg: #0b0f14;
      --text: #e5e7eb;
      --muted: #9aa4b2;
      --border: #1f2937;
      --surface: #111827;
      --accent: #60a5fa;
      --accent-contrast: #0b0f14;
      --focus: #38bdf8;
    }
    html[data-theme="high-contrast"] {
      --bg: #ffffff;
      --text: #000000;
      --muted: #000000;
      --border: #000000;
      --surface: #ffffff;
      --accent: #000000;
      --accent-contrast: #ffffff;
      --focus: #ffbf00;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "
