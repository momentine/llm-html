<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notification Types - Toggle Switches</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #d0d7de;
      --text: #0f172a;
      --muted: #64748b;
      --track-off: #cbd5e1;
      --track-on: #22c55e;
      --knob: #ffffff;
      --focus: #2563eb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.4;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem 1.25rem;
      max-width: 480px;
    }

    legend {
      padding: 0 .5rem;
      font-weight: 600;
    }

    .hint {
      margin: .25rem 0 1rem;
      color: var(--muted);
      font-size: .95rem;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .5rem 0;
    }

    .toggle + .toggle
