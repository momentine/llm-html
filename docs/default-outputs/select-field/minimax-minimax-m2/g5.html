<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessible Theme Select</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --fg: #111111;
      --border: #d0d7de;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --border: #334155;
    }
    [data-theme="high-contrast"] {
      --bg: #000000;
      --fg: #ffffff;
      --border: #ffffff;
      /* Strong borders and outlines for visibility */
    }
    html, body {
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      line-height: 1.5;
      padding: 1rem;
    }
    .field {
      display: inline-block;
    }
    select {
      font: inherit;
      padding: 0.4rem 0.6rem;
      border: 2px solid var(--border);
      border-radius: 0.375rem;
      background: var(--bg);
      color: var(--fg);
    }
    select:focus-visible {
      outline: 3px solid #005fcc;
      outline-offset: 2px;
    }
