<div class="toggle-group">
  <h3>Notification Types</h3>
  <label for="email-toggle">
    <input type="checkbox" id="email-toggle" name="notification" value="email">
    Email
  </label>
  <label for="sms-toggle">
    <input type="checkbox" id="sms-toggle" name="notification" value="sms">
    SMS
  </label>
  <label for="push-toggle">
    <input type="checkbox" id="push-toggle" name="notification" value="push">
    Push
  </label>
</div>
