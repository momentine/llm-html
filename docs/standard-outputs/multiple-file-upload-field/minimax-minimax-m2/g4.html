<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Files</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <label for="upload-files">Upload Files</label>
  <input
    type="file"
    id="upload-files"
    name="files"
    multiple
    accept=".pdf, .docx, .txt, .png, .jpg, .jpeg, .gif, .svg"
  >
</body>
</html>
