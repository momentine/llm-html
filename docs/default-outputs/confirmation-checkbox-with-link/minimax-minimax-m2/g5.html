<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accessible Terms Checkbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <form id="signupForm" action="/signup" method="post" novalidate>
    <div>
      <input
        type="checkbox"
        id="agree"
        name="agree"
        required
        aria-describedby="terms-link"
      />
      <label for="agree">
        I agree to the
        <a id="terms-link" href="/terms" target="_blank" rel="noopener noreferrer">
          Terms and Conditions
        </a>
      </label>
    </div>

    <button type="submit">Create account</button>

    <p id="formStatus" role="status" aria-live="polite"></p>
  </form>

  <script>
    const form = document.getElementById('signupForm');
    const checkbox = document.getElementById('agree');
    const status = document.getElementById('formStatus');

    form.addEventListener('submit', (e) => {
      if (!checkbox.checked) {
        e.preventDefault();
        status.textContent = 'You must agree to the Terms and Conditions before continuing.';
        checkbox.focus();
        return;
      }
      status.textContent = '';
      // Example: allow default submission or handle via fetch as needed.
    });
  </script>
