<form>
  <label for="volume">Volume</label>
  <input
    id="volume"
    name="volume"
    type="range"
    min="1"
    max="10"
    step="1"
    value="5"
    aria-valuemin="1"
    aria-valuemax="10"
    aria-valuenow="5"
    aria-label="Volume"
  />
  <output id="volume-value" for="volume" aria-live="polite">5</output>
</form>
