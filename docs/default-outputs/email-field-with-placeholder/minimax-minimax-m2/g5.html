<label for="desired-email">Desired email address</label>
<input
  id="desired-email"
  name="desired_email"
  type="email"
  inputmode="email"
  autocomplete="email"
  placeholder="yourname@ourdomain.tld"
  aria-describedby="desired-email-hint"
  required
/>
<small id="desired-email-hint">Use yourname@ourdomain.tld format.</small>
