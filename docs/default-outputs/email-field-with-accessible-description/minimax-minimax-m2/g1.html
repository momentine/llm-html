<form id="signup-form">
  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    name="email"
    autocomplete="email"
    required
    aria-describedby="email-note"
    placeholder="you@example.com"
  />
  <small id="email-note">We will never share or sell your email address.</small>
</form>
