<label for="favorite-dinosaur">Who is your favorite dinosaur?</label>
<input
  id="favorite-dinosaur"
  name="favorite_dinosaur"
  type="text"
  required
  aria-describedby="dino-hint"
  placeholder="e.g., Rex"
  autocapitalize="none"
  autocomplete="off"
  autocorrect="off"
  spellcheck="false"
  size="30"
/>
<div id="dino-hint">Hint: Rex</div>
