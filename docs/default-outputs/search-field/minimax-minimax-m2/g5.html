<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessible Search</title>
  <style>
    :root {
      --border: #d0d7de;
      --border-focus: #0969da;
      --bg: #fff;
      --text: #24292f;
      --muted: #57606a;
    }
    body { font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; color: var(--text); padding: 2rem; }
    .search-form { max-width: 36rem; }
    .search-label { display: block; font-weight: 600; margin-bottom: .375rem; }
    .search-input-wrap { position: relative; display: flex; align-items: stretch; }
    .search-input {
      flex: 1;
      padding: .5rem .75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      min-width: 0;
    }
    .search-input:focus {
      outline: 2px solid transparent;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(9, 105, 218, .25);
    }
    .btn {
      cursor: pointer;
      border: 1px solid var(--border);
      background: #f6f8fa;
      color: var(--text);
