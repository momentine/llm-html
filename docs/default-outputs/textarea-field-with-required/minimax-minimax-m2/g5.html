<form action="#" method="post" novalidate>
  <div>
    <label for="message">Message <span aria-hidden="true">*</span></label>
    <textarea
      id="message"
      name="message"
      rows="6"
      required
      aria-required="true"
      aria-describedby="message-help message-count message-error"
    ></textarea>
    <div id="message-help" class="hint">Enter the details of your request.</div>
    <div id="message-count" class="counter" aria-live="polite">0 characters</div>
    <div id="message-error" class="error" role="alert" hidden>Please enter a message.</div>
  </div>
  <button type="submit">Send</button>
</form>
