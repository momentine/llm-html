```html
<label for="code-input">Enter two letters followed by 3 numbers</label>
<input 
  type="text" 
  id="code-input" 
  name="code" 
  pattern="[A-Za-z]{2}[0-9]{3}" 
  maxlength="5"
  aria-describedby="code-hint"
  required
>
<span id="code-hint">Format: Two letters followed by three numbers (e.g., AB123)</span>
```
