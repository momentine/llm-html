<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessible Message Textarea</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; margin: 2rem; }
    .field { margin-block: 1rem; max-width: 60ch; }
    label { display: inline-block; font-weight: 600; margin-bottom: .25rem; }
    .help { color: #555; margin: 0 0 .5rem 0; }
    .error { color: #b00020; margin: .25rem 0 0 0; min-height: 1.25em; }
    textarea { width: 100%; padding: .625rem .75rem; border: 1px solid #999; border-radius: .375rem; resize: vertical; min-height: 8rem; }
    textarea[aria-invalid="true"] { border-color: #b00020; outline-color: #b00020; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-top: .25rem; }
    .counter { color: #555; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <form id="contact-form" novalidate>
    <div class="field">
      <label for="message">Message</label>
      <p id="message-help" class="help">Enter your message (5–500 characters).</p>
      <textarea
        id="message"
        name="message"
        rows="6"
        maxlength="500"
        minlength="5"
        required
        aria
