<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Address</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; margin: 2rem; color: #1f2937; }
    label { display: block; font-weight: 600; margin-bottom: .375rem; }
    input[type="email"] { width: 100%; max-width: 28rem; padding: .625rem .75rem; border: 1px solid #d1d5db; border-radius: .375rem; font-size: 1rem; }
    input[type="email"]:focus { outline: 2px solid #2563eb; outline-offset: 2px; border-color: #2563eb; }
    .note { color: #6b7280; margin-top: .375rem; font-size: .9375rem; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <label for="email">Email Address</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      inputmode="email"
      spellcheck="false"
      aria-describedby="email-note"
      required
    />
    <p id="email-note" class="note">We will never share or sell your email address.</p>
  </form>
</body>
</html>
