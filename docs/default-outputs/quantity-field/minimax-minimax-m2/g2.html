<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Item Quantity</title>
</head>
<body>
  <form action="#" method="get">
    <label for="quantity">Item Quantity</label>
    <input id="quantity" name="quantity" type="number" inputmode="numeric" min="0" step="1" value="1" required>
    <button type="submit">Add to Cart</button>
  </form>
</body>
</html>
