<form action="#" method="post">
  <label for="quantity">Item Quantity</label>
  <input
    id="quantity"
    name="quantity"
    type="number"
    inputmode="numeric"
    min="1"
    max="999"
    step="1"
    value="1"
    required
    aria-describedby="quantity-help"
  />
  <div id="quantity-help">Enter a whole number between 1 and 999.</div>
  <button type="submit">Add to Cart</button>
</form>
