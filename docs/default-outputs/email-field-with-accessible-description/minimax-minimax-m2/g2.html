<form action="#" method="post" novalidate>
  <label for="email">
    Email Address
    <span id="email-note" class="note">We will never share or sell your email address.</span>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
      aria-describedby="email-note"
    />
  </label>
  <button type="submit">Sign up</button>
</form>
