  <title>Fruit Checkbox Group</title>

    button { margin-top: 1rem; }
  </style>
</head>

      </div>
      <p id="fruit-error" class="error" role="alert" aria-live="polite"></p>
    </fieldset>
    <button type="submit">Submit</button>
  </form>
