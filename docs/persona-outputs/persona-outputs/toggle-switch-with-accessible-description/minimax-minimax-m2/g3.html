<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications Toggle</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --track-off: #e5e7eb;
      --track-on: #10b981;
      --knob: #ffffff;
      --focus: #2563eb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.4;
    }
    .field {
      display: grid;
      gap: 0.5rem;
      width: min(520px, 92vw);
    }
    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .label-row label {
      font-weight: 600;
    }
    .note {
      color: var(--muted);
      font-size: 0.925rem;
      margin: 0;
    }
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      user-select: none;
      cursor: pointer;
    }
    .switch input[type="checkbox"] {
      appearance: none
