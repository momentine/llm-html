<form action="/submit" method="post">
  <label for="new-password">New password</label>
  <input
    id="new-password"
    name="new_password"
    type="password"
    required
    autocomplete="new-password"
    placeholder="Enter new password"
  />
  <button type="button" aria-controls="new-password" aria-label="Show password">Show</button>
</form>
