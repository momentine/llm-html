<form id="signupForm" action="#" method="post" novalidate>
  <div class="field">
    <label for="desiredEmail">Desired email address</label>
    <p id="emailHint" class="hint">Use a valid email like name@example.com. You’ll need to verify it.</p>
    <input
      id="desiredEmail"
      name="desiredEmail"
      type="email"
      inputmode="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      required
      aria-describedby="emailHint emailError"
      aria-invalid="false"
      placeholder="name@example.com"
    />
    <p id="emailError" class="error" role="alert" hidden>
      Please enter a valid email address (for example, name@example.com).
    </p>
  </div>

  <button type="submit">Continue</button>

  <p id="successMsg" class="success" role="status" aria-live="polite" hidden>
    If the email is available, we’ll reserve it for you.
  </p>
</form>

<script>
  (function () {
    const form = document.getElementById('signupForm');
    const email = document.getElementById('desiredEmail');
    const error = document.getElementById('emailError');
    const successMsg = document.getElementById('successMsg');

    function showError(message) {
      error.textContent = message || error.textContent;
      error.hidden = false;
      email.setAttribute('aria-invalid', 'true');
    }

    function clearError() {
      error.hidden = true;
      email.setAttribute('aria-invalid', 'false');
    }

    email.addEventListener('input', function () {
      if (email.validity.valid) {
        clearError();
        successMsg.hidden = true;
      }
    });
