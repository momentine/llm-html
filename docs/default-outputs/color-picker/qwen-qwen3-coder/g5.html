<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Color Picker</title>
</head>
<body>
    <label for="colorPicker">Pick a color:</label>
    <input type="color" id="colorPicker" name="colorPicker" value="#000000" aria-describedby="colorHelp">
    <div id="colorHelp">Select a color using the color picker</div>
</body>
</html>
