<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toggle Switch - Notifications</title>
  <style>
    :root {
      --bg-off: #e5e7eb;
      --bg-on: #2563eb;
      --thumb: #ffffff;
      --text: #111827;
      --note: #6b7280;
      --focus: #3b82f6;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
      color: var(--text);
      margin: 0;
      padding: 2rem;
      background: #fafafa;
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      max-width: 28rem;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: 0 0 auto;
    }
    .toggle input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      border: 0;
    }
