<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New password</title>
</head>
<body>
  <label for="new-password">New password</label>
  <input
    id="new-password"
    name="new-password"
    type="password"
    required
    minlength="8"
    autocomplete="new-password"
  />
</body>
</html>
