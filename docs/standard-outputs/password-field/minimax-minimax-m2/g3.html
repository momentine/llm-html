<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>New Password Field</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      display: grid;
      place-items: start;
      gap: 0.75rem;
    }
    label { font-weight: 600; }
    .field { display: flex; align-items: center; gap: 0.5rem; }
    input[type="password"] {
      font: inherit;
      padding: 0.5rem 0.625rem;
      border: 1px solid #c8c8c8;
      border-radius: 0.375rem;
      min-width: 16rem;
    }
    button {
      font: inherit;
      padding: 0.5rem 0.625rem;
      border: 1px solid #c8c8c8;
      background: #f5f5f5;
      border-radius: 0.375rem;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    button:active { background: #e9e9e9; }
  </style>
</head>
<body>
  <label for="new-password">New password</label>
  <div class="field">
    <input
      id="new-password"
      name="new_password"
      type="password"
      inputmode="text"
      autocomplete="new-password"
      spellcheck="false"
      aria-describedby="password-help"
      required
    />
    <button type="button" id="toggle-password" aria-controls="new-password" aria-pressed="false">
      Show
    </button>
  </div>
  <small id="password-help">Use at least 8 characters, including letters and numbers.</small>

  <script>
    (function () {
      const input = document.getElementById('new-password');
      const toggle = document.getElementById('toggle-password');

      function applyState() {
        const isText = input.type === 'text';
        input.type = isText ? 'password' : 'text';
        toggle.textContent = isText ? 'Show' : 'Hide';
