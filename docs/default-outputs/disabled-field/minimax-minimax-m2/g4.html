<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disabled Promo Code Field</title>
</head>
<body>
  <form action="/apply" method="post">
    <label for="promo-code">Promo Code</label>
    <input
      type="text"
      id="promo-code"
      name="promoCode"
      value="SAVE20"
      placeholder="Enter promo code"
      disabled
    />
  </form>
</body>
</html>
