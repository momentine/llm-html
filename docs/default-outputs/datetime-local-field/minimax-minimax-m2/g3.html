<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Time Input</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 2rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .35rem; font-weight: 600; }
    input[type="datetime-local"] { padding: .5rem; font-size: 1rem; }
  </style>
</head>
<body>
  <form id="event-form">
    <div class="field">
      <label for="event-time">Event Time</label>
      <input
        id="event-time"
        name="event_time"
        type="datetime-local"
        required
        step="60"
      />
    </div>
    <button type="submit">Submit</button>
    <p id="output" aria-live="polite"></p>
  </form>

  <script>
    (function () {
      const input = document.getElementById('event-time');
      const output = document.getElementById('output');
      const form = document.getElementById('event-form');

      // Set default value to current local time
      function toLocalDatetimeValue(date = new Date()) {
        const pad = n => String(n).padStart(2, '0');
        const y = date.getFullYear();
        const m = pad(date.getMonth() + 1);
        const d = pad(date.getDate());
        const hh = pad(date.getHours());
        const mm = pad(date.getMinutes());
        return `${y}-${m}-${d}T${hh}:${mm}`;
      }
      input.value = toLocalDatetimeValue();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!input.value) {
          input.reportValidity();
          return;
        }
        const dt = new Date(input.value);
        output.textContent = `Selected: ${dt.toLocaleString()}`;
      });
    })();
  </script>
</body>
</html>
