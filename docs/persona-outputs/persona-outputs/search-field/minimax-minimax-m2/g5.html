<form role="search" action="/search" method="get">
  <label class="sr-only" for="search">Search</label>
  <input
    id="search"
    name="q"
    type="search"
    placeholder="Search"
    autocomplete="on"
    enterkeyhint="search"
    aria-describedby="search-help"
  />
  <button type="submit" aria-label="Submit search">Search</button>
  <button type="button" aria-label="Clear search" hidden>Clear</button>
  <p id="search-help" class="sr-only">Type your query and press Enter.</p>
</form>
