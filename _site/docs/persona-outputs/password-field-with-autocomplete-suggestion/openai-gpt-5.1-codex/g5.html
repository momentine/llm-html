<form>
  <label for="new-password">New Password</label>
  <input id="new-password" name="new-password" type="password" autocomplete="new-password" aria-describedby="password-help" required>
  <span id="password-help">Use at least 12 characters with a mix of letters, numbers, and symbols.</span>
  <button type="submit">Save Password</button>
</form>
