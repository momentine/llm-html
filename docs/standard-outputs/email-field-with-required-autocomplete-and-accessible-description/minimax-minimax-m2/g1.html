<form>
  <label for="email">Email Address</label>
  <input
    id="email"
    name="email"
    type="email"
    required
    autocomplete="email"
    placeholder="you@example.com"
    inputmode="email"
  />
  <small>We will never share or sell your email address</small>
  <button type="submit">Submit</button>
</form>
