<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Volume Range Slider (1–10)</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
      margin: 2rem;
    }
    .volume-group {
      max-width: 420px;
    }
    .label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.25rem;
    }
    label {
      font-weight: 600;
    }
    output {
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: right;
    }
    .range-wrapper {
      display: grid;
      gap: 0.25rem;
    }
    input[type="range"] {
      width: 100%;
      margin: 0;
    }
    .ticks {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #666;
      padding: 0 0.25rem;
    }
    .ticks span {
      position: relative;
      text-align: center;
      width: 1ch;
    }
