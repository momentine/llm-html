<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Volume Range Slider (1–10)</title>
  <style>
    :root {
      --focus: #1d4ed8;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 2rem;
      color: #111;
      background: #fff;
    }
    .field {
      max-width: 28rem;
    }
    label {
      display: inline-block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .slider-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.75rem;
    }
    input[type="range"] {
      width: 100%;
    }
    output {
      min-width: 2ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .ticks {
      margin-top: 0.25rem;
      color: #555;
      font-size: 0.875rem;
    }
