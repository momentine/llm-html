<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Upload</title>
</head>
<body>
    <form>
        <label for="document-upload">
            Upload Document
        </label>
        <input 
            type="file" 
            id="document-upload" 
            name="document-upload"
            accept=".pdf,.doc,.docx,.txt,.rtf,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            aria-describedby="file-requirements"
        >
        <div id="file-requirements">
            <p>Accepted file types: PDF, DOC, DOCX, TXT, RTF</p>
            <p>Maximum file size: 10MB</p>
        </div>
    </form>
</body>
</html>
