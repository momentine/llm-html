<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website URL Field</title>
</head>
<body>
  <form>
    <label for="website-url">Website URL</label>
    <input
      id="website-url"
      name="website"
      type="url"
      placeholder="https://example.com"
      autocomplete="url"
      spellcheck="false"
      inputmode="url"
      required
    />
    <button type="submit">Submit</button>
  </form>
</body>
</html>
