<html lang="en">

  <title>Accessible Theme Radio Group</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --focus: #2563eb;
      --control: #111827;
      --control-bg: #f9fafb;
      --control-border: #d1d5db;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --focus: #2563eb;
      --control: #111827;
      --control-bg: #ffffff;
      --control-border: #d1d5db;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f14;

      --control-bg: #0b0f14;
      --control-border: #374151;
    }
