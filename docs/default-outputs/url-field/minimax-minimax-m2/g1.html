<label for="website-url">Website URL</label>
<input
  type="url"
  id="website-url"
  name="website_url"
  placeholder="https://example.com"
  autocomplete="url"
  inputmode="url"
  spellcheck="false"
  aria-describedby="website-url-help"
  required
/>
<small id="website-url-help">Enter a full URL starting with https://</small>
