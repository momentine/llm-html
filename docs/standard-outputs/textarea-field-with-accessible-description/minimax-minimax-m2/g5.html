<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Field</title>
</head>
<body>
  <form action="#" method="post">
    <label for="message">Message</label>
    <textarea
      id="message"
      name="message"
      rows="6"
      required
      aria-describedby="message-help"
      spellcheck="true"
      autocapitalize="sentences"
    ></textarea>
    <p id="message-help">Please describe your problem in as much detail as possible.</p>
  </form>
</body>
</html>
