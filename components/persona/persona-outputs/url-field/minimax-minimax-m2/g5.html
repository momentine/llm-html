<form id="url-form" novalidate>
  <div>
    <label for="website-url">Website URL</label>
    <input
      id="website-url"
      name="website"
      type="url"
      inputmode="url"
      placeholder="https://example.com"
      autocomplete="url"
      spellcheck="false"
      aria-describedby="url-help url-error"
      aria-invalid="false"
      required
    />
    <div id="url-help" class="help">
      Enter a full URL that starts with http:// or https:// (for example, https://www.example.com).
    </div>
    <div id="url-error" class="error" role="alert" aria-live="polite"></div>
  </div>
  <button type="submit">Save</button>
</form>

<script>
  (function () {
    const form = document.getElementById('url-form');
    const input = document.getElementById('website-url');
    const errorEl = document.getElementById('url-error');

    function setError(message) {
      errorEl.textContent = message;
      input.setAttribute('aria-invalid', 'true');
    }

    function clearError() {
      errorEl.textContent = '';
      input.setAttribute('aria-invalid', 'false');
    }

    function isValidUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function validate() {
      const value = input.value.trim();

      if (value === '') {
        setError('Please enter a website URL.');
        return false;
      }
      if (!isValidUrl(value)) {
        setError('Enter a valid URL that starts with http
