<form id="email-form" action="#" method="post" novalidate>
  <div>
    <label for="email">Email Address</label>
    <input
      id="email"
      name="email"
      type="email"
      inputmode="email"
      autocomplete="email"
      autocapitalize="off"
      spellcheck="false"
      aria-describedby="email-note email-error"
      required
    />
    <p id="email-note">We will never share or sell your email address.</p>
    <p id="email-error" role="alert" hidden></p>
  </div>
  <button type="submit">Subscribe</button>
  <p id="form-status" role="status" aria-live="polite" hidden></p>
</form>
