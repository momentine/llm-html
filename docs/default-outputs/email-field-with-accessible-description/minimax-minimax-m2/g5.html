<form action="#" method="post">
  <div>
    <label for="email">Email Address</label>
    <input
      id="email"
      name="email"
      type="email"
      inputmode="email"
      autocomplete="email"
      required
      aria-describedby="email-note"
    />
    <p id="email-note">We will never share or sell your email address.</p>
  </div>
  <button type="submit">Submit</button>
</form>
