<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Email Field with Validation Error</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input[type="email"] { width: 100%; max-width: 24rem; padding: 0.5rem; border: 1px solid #bbb; border-radius: 4px; }
    .error { color: #b00020; margin-top: 0.5rem; }
    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <form id="emailForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        aria-describedby="email-error"
        aria-invalid="false"
      />
      <p id="email-error" class="error" role="alert" aria-live="polite" hidden>
        Your email address is invalid.
      </p>
    </div>

    <button type="submit">Submit</button>
  </form>

  <script>
    (function () {
      const form = document.getElementById('emailForm');
      const email = document.getElementById('email');
      const error = document.getElementById('email-error');

      function showError(message) {
        error.textContent = message || 'Your email address is invalid.';
        error.hidden = false;
        email.setAttribute('aria-invalid', 'true');
      }

      function clearError() {
        error.hidden = true;
        email.setAttribute('aria-invalid', 'false');
      }
