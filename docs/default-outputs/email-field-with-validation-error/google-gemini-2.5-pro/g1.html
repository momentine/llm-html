<!DOCTYPE html>
<html lang="en">
<head>
    <title>Email Field</title>
</head>
<body>
    <form>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Your email address is invalid.">
    </form>
</body>
