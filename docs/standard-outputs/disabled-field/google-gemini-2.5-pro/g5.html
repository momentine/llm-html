```html
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Accessible Disabled Text Field</title>
</head>
<body>
  <div>
    <label for="promo-code">Promo Code</label>
    <input type="text" id="promo-code" name="promo_code" value="SALE25" disabled aria-describedby="promo-code-description">
    <p id="promo-code-description">A promo code has already been applied to your order.</p>
  </div>
</body>
</html>
