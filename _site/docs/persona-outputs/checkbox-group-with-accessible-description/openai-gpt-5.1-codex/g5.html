<form>
  <fieldset aria-describedby="fruit-note">
    <legend>What fruits do you like?</legend>
    <p id="fruit-note">You can change this later</p>
    <div>
      <input type="checkbox" id="fruits-bananas" name="fruits" value="bananas">
      <label for="fruits-bananas">Bananas</label>
    </div>
    <div>
      <input type="checkbox" id="fruits-oranges" name="fruits" value="oranges">
      <label for="fruits-oranges">Oranges</label>
    </div>
    <div>
      <input type="checkbox" id="fruits-apples" name="fruits" value="apples">
      <label for="fruits-apples">Apples</label>
    </div>
  </fieldset>
</form>
