<fieldset>
  <legend>Theme</legend>
  <div>
    <label>
      <input type="radio" name="theme" value="light" checked>
      Light
    </label>
  </div>
  <div>
    <label>
      <input type="radio" name="theme" value="dark">
      Dark
    </label>
  </div>
  <div>
    <label>
      <input type="radio" name="theme" value="high-contrast">
      High Contrast
    </label>
  </div>
  <small>You can change this later</small>
</fieldset>
