<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Required Text Field</title>
</head>
<body>
  <form action="#" method="get">
    <label for="color">What color is an orange?</label><br>
    <input type="text" id="color" name="color" required>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
