<form>
  <fieldset>
    <legend>Notification Types</legend>
    <div>
      <input type="checkbox" id="notification-email" role="switch" name="notification-types" value="email">
      <label for="notification-email">Email</label>
    </div>
    <div>
      <input type="checkbox" id="notification-sms" role="switch" name="notification-types" value="sms">
      <label for="notification-sms">SMS</label>
    </div>
    <div>
      <input type="checkbox" id="notification-push" role="switch" name="notification-types" value="push">
      <label for="notification-push">Push</label>
    </div>
  </fieldset>
</form>
