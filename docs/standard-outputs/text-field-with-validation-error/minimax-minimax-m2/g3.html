      <div id="colorError" class="error" role="alert" aria-live="assertive"></div>
    </div>
    <button type="submit">Submit</button>
  </form>

        input.setAttribute('aria-invalid', 'true');
      }

        input.removeAttribute('aria-invalid');
      }
