<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Field</title>
</head>
<body>
  <form role="search" action="/search" method="get">
    <label for="search">Search</label>
    <input
      id="search"
      name="q"
      type="search"
      placeholder="Search"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search"
    />
  </form>
</body>
</html>
