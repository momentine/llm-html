```html
<div>
  <label for="file-upload" id="file-upload-label">
    Upload Files
  </label>
  <input
    type="file"
    id="file-upload"
    name="files"
    multiple
    accept=".pdf,.docx,.txt,.png,.jpg,.gif,.svg"
    aria-labelledby="file-upload-label"
    aria-describedby="file-upload-description"
  />
  <div id="file-upload-description">
    Accepted file types: PDF, DOCX, TXT, PNG, JPG, GIF, SVG. You may select multiple files.
  </div>
</div>
```
