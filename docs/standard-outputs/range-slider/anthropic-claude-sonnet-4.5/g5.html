```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Control</title>
</head>
<body>
    <div>
        <label for="volume">Volume</label>
        <input 
            type="range" 
            id="volume" 
            name="volume" 
            min="1" 
            max="10" 
            value="5" 
            step="1"
            aria-valuemin="1"
            aria-valuemax="10"
            aria-valuenow="5"
            aria-label="Volume control from 1 to 10">
        <output for="volume" aria-live="polite">5</output>
    </div>
</body>
</html>
```
