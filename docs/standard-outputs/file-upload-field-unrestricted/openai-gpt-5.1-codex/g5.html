<!DOCTYPE html>
<html lang="en">
<head>
<title>Accessible File Upload</title>
</head>
<body>
<form>
<label for="file-upload">Upload a File</label>
<input type="file" id="file-upload" name="file-upload" aria-describedby="upload-instructions">
<p id="upload-instructions">Choose any file from your device to upload.</p>
<button type="submit">Submit</button>
</form>
</body>
</html>
