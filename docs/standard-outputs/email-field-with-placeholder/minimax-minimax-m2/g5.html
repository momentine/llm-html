<label for="desired-email">Desired email address</label>
<input
  type="email"
  id="desired-email"
  name="desired_email"
  placeholder="yourname@ourdomain.tld"
  autocomplete="email"
  inputmode="email"
  aria-describedby="desired-email-hint"
  required
/>
<span id="desired-email-hint" class="hint">Use the format yourname@ourdomain.tld</span>
