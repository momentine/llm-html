<label for="new-password">New password</label>
<input
  id="new-password"
  name="new-password"
  type="password"
  required
  pattern="(?=.*\d)(?=.*\W).+"
  title="Must include 1 number and 1 symbol."
  autocomplete="new-password"
  aria-describedby="password-note"
/>
<small id="password-note">Must include 1 number and 1 symbol.</small>
