<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Email Field Example</title>
</head>
<body>
  <form action="#" method="post">
    <label for="email">Email Address</label><br />
    <input
      id="email"
      name="email"
      type="email"
      required
      autocomplete="email"
      aria-describedby="email-note"
    /><br />
    <small id="email-note">We will never share or sell your email address.</small>
  </form>
</body>
</html>
