<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessible Search with Hidden Label</title>
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    label[for="search"] { /* ensure label is hidden but present for AT */
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
</head>
<body>
  <form role="search" action="/search" method="get">
    <label for="search">Search for</label>
    <input
      id="search"
      name="q"
      type="search"
      placeholder="Search"
      aria-label="Search for"
      required
    />
    <button type="submit">Search</button>
  </form>
</body>
</html>
