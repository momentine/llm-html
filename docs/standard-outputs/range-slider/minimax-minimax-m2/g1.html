<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volume Slider</title>
</head>
<body>
  <form>
    <label for="volume">Volume</label>
    <input
      type="range"
      id="volume"
      name="volume"
      min="1"
      max="10"
      step="1"
      value="5"
      aria-label="Volume"
    />
  </form>
</body>
</html>
