<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notification Types - Accessible Toggle Switches</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0b1324;
      --muted: #5b6472;
      --border: #c8ced6;
      --track-off: #d7dce2;
      --track-on: #1e7a46;
      --thumb: #ffffff;
      --focus: #005fcc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --fg: #e7e9ee;
        --muted: #a9b0bc;
        --border: #2a313a;
        --track-off: #3a424e;
        --track-on: #2ea86b;
        --thumb: #f3f5f9;
        --focus: #7db3ff;
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      padding: 2rem;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1rem 0.75rem;
      max-width: 28rem;
    }
