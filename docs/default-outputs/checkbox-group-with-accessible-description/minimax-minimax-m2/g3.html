<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkbox Group - Fruits</title>
</head>
<body>
  <form>
    <fieldset>
      <legend>What fruits do you like?</legend>

      <label>
        <input type="checkbox" name="fruits" value="bananas" id="bananas" />
        Bananas
      </label><br />

      <label>
        <input type="checkbox" name="fruits" value="oranges" id="oranges" />
        Oranges
      </label><br />

      <label>
        <input type="checkbox" name="fruits" value="apples" id="apples" />
        Apples
      </label>
    </fieldset>

    <p><small>You can change this later</small></p>
  </form>
</body>
</html>
