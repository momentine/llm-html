<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Document</title>
<style>
:root {
  --bg:#ffffff; --fg:#111827; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb; --accent-weak:#dbeafe;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
.container{max-width:560px;margin:0 auto}
.field{margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:8px}
.help{color:var(--muted);font-size:0.9rem;margin-top:6px}
input[type=file]{display:block;width:100%}
.file-info{margin-top:8px;font-size:0.95rem}
button{margin-top:12px;padding:10px 14px;border:1px solid var(--border);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}
button:hover{filter:brightness(0.96)}
button:disabled{opacity:.6;cursor:not-allowed}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b0f14;--fg:#e5e7eb;--muted:#9ca3af;--border:#263041;--accent:#3b82f6;--accent-weak:#0b2447}
  body{background:var(--bg);color:var(--fg)}
  button{border-color:transparent}
}
</style>
</head>
<body>
  <div class="container">
    <form id="uploadForm" action="/upload
