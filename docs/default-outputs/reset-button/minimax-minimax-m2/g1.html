<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset Button</title>
</head>
<body>
  <form id="myForm">
    <label>
      Name:
      <input name="name" value="Alice">
    </label>
    <br>
    <label>
      Email:
      <input name="email" type="email" value="alice@example.com">
    </label>
    <br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
