<!DOCTYPE html>
<html>
<head>
    <title>Select Field</title>
</head>
<body>
    <label for="theme-select">Theme</label>
    <select name="theme" id="theme-select">
        <option value="light">light</option>
        <option value="dark">dark</option>
        <option value="high-contrast">high contrast</option>
    </select>
</body>
</html>
