<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Button</title>
</head>
<body>
  <form id="demo-form">
    <label>
      Name
      <input name="name" type="text" value="Jane Doe" />
    </label>
    <label>
      Email
      <input name="email" type="email" value="jane@example.com" />
    </label>

    <!-- Reset button and label -->
    <label for="reset-btn">Reset</label>
    <button id="reset-btn" type="reset">Reset</button>
  </form>
</body>
</html>
