<fieldset>
  <legend>What fruits do you like?</legend>
  <div>
    <input type="checkbox" id="fruit-banana" name="fruits" value="bananas">
    <label for="fruit-banana">Bananas</label>
  </div>
  <div>
    <input type="checkbox" id="fruit-orange" name="fruits" value="oranges">
    <label for="fruit-orange">Oranges</label>
  </div>
  <div>
    <input type="checkbox" id="fruit-apple" name="fruits" value="apples">
    <label for="fruit-apple">Apples</label>
  </div>
  <p>You can change this later</p>
</fieldset>
