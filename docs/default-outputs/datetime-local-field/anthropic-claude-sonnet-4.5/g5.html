```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Time Input</title>
</head>
<body>
    <form>
        <label for="event-time">Event Time</label>
        <input 
            type="datetime-local" 
            id="event-time" 
            name="event-time" 
            required 
            aria-describedby="event-time-help"
        >
        <small id="event-time-help">Select the date and time for your event</small>
    </form>
</body>
</html>
