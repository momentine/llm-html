<form action="#" method="post">
  <label for="email">Email Address</label>
  <input
    id="email"
    name="email"
    type="email"
    autocomplete="email"
    required
    aria-describedby="email-note"
  />
  <small id="email-note">We will never share or sell your email address.</small>
  <div>
    <button type="submit">Submit</button>
  </div>
</form>
