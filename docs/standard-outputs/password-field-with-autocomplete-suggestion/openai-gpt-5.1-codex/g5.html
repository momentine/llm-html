<form>
  <label for="new-password">Create a new password</label>
  <input id="new-password" type="password" name="new-password" autocomplete="new-password" aria-describedby="password-help" required>
  <div id="password-help">Use at least 12 characters, combining letters, numbers, and symbols.</div>
  <button type="submit">Save Password</button>
</form>
