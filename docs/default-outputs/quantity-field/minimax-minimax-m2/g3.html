<form action="/submit" method="post">
  <label for="item-quantity">Item Quantity</label>
  <input
    type="number"
    id="item-quantity"
    name="item_quantity"
    min="1"
    step="1"
    required
    aria-describedby="item-quantity-help"
  />
  <div id="item-quantity-help" aria-live="polite">Enter a whole number (minimum 1).</div>
  <button type="submit">Add to Cart</button>
</form>
