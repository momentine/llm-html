<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Color Picker</title>
  <style>
    :root {
      --bg: #0b0c0f;
      --panel: #111318;
      --text: #e8eaed;
      --muted: #aeb4bd;
      --border: #2a2f3a;
      --focus: #4c8bf5;
      --error: #ff6b6b;
      --ok: #34c759;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #0b0c0f;
        --muted: #5f6368;
        --border: #d9dee7;
        --focus: #1a73e8;
        --error: #c62828;
        --ok: #0f9d58;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius
