<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notifications Toggle</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --border: #d1d5db;
      --knob: #ffffff;
      --on: #2563eb;
      --text: #111827;
      --muted: #6b7280;
      --focus: #93c5fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: #ffffff;
      color: var(--text);
      line-height: 1.5;
    }
    .field {
      display: grid;
      gap: 0.5rem;
      max-width: 28rem;
    }
    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    label {
      font-weight: 600;
    }
    .hint {
      color: var(--muted);
      font-size: 0.9375rem;
    }

    /* Accessible visually-hidden utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex: 0 0 auto;
    }
    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
