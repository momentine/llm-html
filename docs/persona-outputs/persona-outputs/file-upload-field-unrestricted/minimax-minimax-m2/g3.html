<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unrestricted File Upload</title>
</head>
<body>
  <form action="#" method="post" enctype="multipart/form-data">

  </form>
</body>
</html>
